# ANALYTICS — replace with your actual IDs
google_analytics: "G-XXXXXXXXXX"
facebook_pixel: "XXXXXXXXXXXXXXXXX"

# JEKYLL PLUGINS (all whitelisted for GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed

# SITEMAP CONFIG
defaults:
  - scope:
      path: ""
    values:
      sitemap: true
      image: "/marjiya-auto/assets/images/marjiya-auto-og.webp"

# EXCLUDE FROM BUILD
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - README.md

# INCLUDE IN BUILD
include:
  - _pages
  - robots.txt

# COLLECTIONS
collections:
  products:
    output: true
    permalink: /products/:name/

# MARKDOWN
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# SASS
sass:
  style: compressed

# PAGINATION
paginate: 24
paginate_path: "/products/page/:num/"

# TIMEZONE
timezone: Asia/Dhaka

# FEED
feed:
  path: feed.xml
